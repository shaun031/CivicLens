[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "civiclens-api"
version = "0.1.0"
description = "CivicLens local API and future Lambda application"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=25.1,<26",
  "email-validator>=2.2,<3",
  "PyJWT[crypto]>=2.10,<3",
  "httpx>=0.28,<1",
  "pillow>=12.3,<13",
  "scikit-learn>=1.7,<2",
  "python-multipart>=0.0.22,<1",
  "boto3>=1.42,<2",
  "fastapi>=0.147,<1",
  "mangum>=0.19,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "security: authorization, privacy, validation and evidence regression checks",
  "concurrency: actual thread races and their integrity assertions",
  "contracts: backend/frontend or HTTP contract checks",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

